{% extends 'predictor_app/base.html' %}
{% block content %}
<div class="card">
    <div class="card-header bg-primary text-white">
        <h4>Your Risk Report</h4>
    </div>
    <div class="card-body text-center">
        <h2>{{ result.status }}</h2>
        <h4>Risk Score: {{ result.risk_score }}/100</h4>
        <p>Default Probability: {{ result.default_prob }}%</p>
        <a href="/analyze/" class="btn btn-primary">Analyze Again</a>
    </div>
</div>
{% endblock %}
